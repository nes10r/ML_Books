<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ColumnTransformer ilə hazırlıq pipeline-ı</title>
