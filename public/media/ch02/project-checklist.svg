<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ML layihəsinin mərhələləri</title>
  <desc id="d">Səkkiz mərhələ: problemin qoyuluşu, məlumatın əldə edilməsi, kəşf, hazırlıq, model seçimi, dəqiqləşdirmə, təqdimat, istifadəyə vermə və monitorinq. Monitorinqdən yenidən məlumata qayıdan ox dövrün təkrarlandığını göstərir.</desc>
