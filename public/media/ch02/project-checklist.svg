      <text x="782" y="295" fill="#1e1b4b" font-weight="600">Model</text><text x="752" y="327" fill="#1e1b4b" font-weight="600">seçimi</text><text x="752" y="347" fill="#64748b" font-size="12">çarpaz validasiya</text>
    </g>
