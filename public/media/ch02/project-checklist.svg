    <g>
      <rect x="40" y="60" width="190" height="96" rx="14" fill="#eef2ff" stroke="#a5b4fc"/>
      <circle cx="68" cy="88" r="15" fill="#4f46e5"/><text x="68" y="93" text-anchor="middle" fill="#fff" font-weight="700">1</text>
      <text x="92" y="93" fill="#1e1b4b" font-weight="600">Problemin</text><text x="62" y="125" fill="#1e1b4b" font-weight="600">qoyuluşu</text><text x="62" y="145" fill="#64748b" font-size="12">məqsəd, metrika</text>
