    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker>
  </defs>
  <rect width="960" height="420" rx="20" fill="#ffffff"/>
  <g font-size="14">
