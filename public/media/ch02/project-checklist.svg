      <circle cx="528" cy="290" r="15" fill="#4f46e5"/><text x="528" y="295" text-anchor="middle" fill="#fff" font-weight="700">6</text>
      <text x="552" y="295" fill="#1e1b4b" font-weight="600">Dəqiqləşdirmə</text><text x="522" y="327" fill="#1e1b4b" font-weight="600">axtarış, test</text><text x="522" y="347" fill="#64748b" font-size="12">hiperparametrlər</text>
