      <text x="782" y="93" fill="#1e1b4b" font-weight="600">Hazırlıq</text><text x="752" y="125" fill="#1e1b4b" font-weight="600">pipeline</text><text x="752" y="145" fill="#64748b" font-size="12">təmizləmə, miqyas</text>
    </g>
