      <text x="322" y="93" fill="#1e1b4b" font-weight="600">Məlumatın</text><text x="292" y="125" fill="#1e1b4b" font-weight="600">əldə edilməsi</text><text x="292" y="145" fill="#64748b" font-size="12">yükləmə, test dəsti</text>
    </g>
    <g>
      <rect x="500" y="60" width="190" height="96" rx="14" fill="#eef2ff" stroke="#a5b4fc"/>
      <circle cx="528" cy="88" r="15" fill="#4f46e5"/><text x="528" y="93" text-anchor="middle" fill="#fff" font-weight="700">3</text>
