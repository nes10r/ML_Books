  <text x="325" y="194" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Proqram</text>
  <path d="M196 138 C225 138 225 175 248 178" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M196 238 C225 238 225 202 248 198" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M325 221 L325 290" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="250" y="294" width="150" height="52" rx="10" fill="#fff" stroke="#cbd5e1"/>
