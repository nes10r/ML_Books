<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Ənənəvi proqramlaşdırma və maşın öyrənməsi</title>
  <desc id="d">Ənənəvi yanaşmada qaydalar və məlumat proqrama verilir, cavab alınır. ML-də məlumat və cavablar alqoritmə verilir, qaydalar (model) alınır.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="960" height="420" rx="20" fill="#ffffff"/>
  <rect x="24" y="24" width="440" height="372" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
