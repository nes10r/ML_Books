  <rect x="528" y="210" width="140" height="56" rx="10" fill="#fff" stroke="#a5b4fc"/>
  <text x="598" y="244" text-anchor="middle" font-size="16" fill="#3730a3">Cavablar</text>
  <text x="598" y="284" text-anchor="middle" font-size="12" fill="#6366f1">(etiketlər)</text>
