<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Təlim, validasiya və test dəstləri</title>
  <desc id="d">Məlumat 70% təlim, 15% validasiya və 15% test hissələrinə bölünür. Aşağıda 5 qatlı çarpaz validasiyada hər turda fərqli hissənin validasiya kimi istifadəsi göstərilir.</desc>
  <rect width="960" height="380" rx="20" fill="#ffffff"/>
  <text x="40" y="50" font-size="18" font-weight="700" fill="#0f172a">Sadə bölgü (holdout)</text>
  <rect x="40" y="70" width="616" height="56" rx="10" fill="#6366f1"/>
  <text x="348" y="104" text-anchor="middle" font-size="16" fill="#fff" font-weight="600">Təlim ≈ 70%</text>
  <rect x="660" y="70" width="128" height="56" rx="10" fill="#f59e0b"/>
  <text x="724" y="104" text-anchor="middle" font-size="15" fill="#fff" font-weight="600">Validasiya</text>
  <rect x="792" y="70" width="128" height="56" rx="10" fill="#0f172a"/>
  <text x="856" y="104" text-anchor="middle" font-size="15" fill="#fff" font-weight="600">Test 🔒</text>
  <text x="40" y="186" font-size="18" font-weight="700" fill="#0f172a">5 qatlı çarpaz validasiya (test dəsti ayrıca saxlanılır)</text>
  <g font-size="12" fill="#475569">
